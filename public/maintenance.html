<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maintenance — SkyCobra Studio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  /* Entièrement autonome : cette page doit s'afficher même si le reste du site
     est cassé ou absent. Aucune ressource externe, aucun script. */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background-image:
      repeating-linear-gradient(0deg,rgba(20,10,4,.20) 0,transparent 1px,transparent 4px),
      repeating-linear-gradient(180deg,transparent 0,transparent 86px,rgba(12,6,2,.75) 87px,rgba(12,6,2,.5) 89px,transparent 90px,transparent 180px),
      linear-gradient(180deg,#4a3220 0%,#3a2614 50%,#2a1b0c 100%);
    background-attachment:fixed;
  }

  .card{
    width:100%;
    max-width:500px;
    padding:44px 40px 38px;
    text-align:center;
    border:1px solid #c9b582;
    border-radius:3px;
    box-shadow:0 10px 40px rgba(0,0,0,.45);
    background-image:
      radial-gradient(ellipse 200px 120px at 78% 6%,rgba(150,100,50,.15) 0%,transparent 70%),
      radial-gradient(ellipse at 30% 20%,#f4ecd6 0%,#ead9b3 65%,#d8c391 100%);
  }

  .badge{
    display:inline-block;
    margin:0 0 20px;
    padding:5px 12px;
    border:1px solid rgba(31,22,12,.3);
    border-radius:2px;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#6a5532;
  }

  h1{
    margin:0 0 14px;
    font-family:Georgia,'Times New Roman',serif;
    font-size:26px;
    font-weight:600;
    letter-spacing:.04em;
    color:#1f160c;
  }

  p{
    margin:0 0 8px;
    font-size:15px;
    line-height:1.6;
    color:#4a3a22;
  }

  .en{
    margin:14px 0 0;
    font-size:13px;
    font-style:italic;
    color:#6a5532;
  }

  .sign{
    margin:28px 0 0;
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#6a5532;
  }

  @media (max-width:520px){
    .card{padding:34px 24px 30px}
    h1{font-size:22px}
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">Maintenance</span>
    <h1>Le site est momentanément indisponible</h1>
    <p>Une mise à jour est en cours. Merci de revenir dans quelques instants.</p>
    <p class="en">The site is temporarily down for maintenance. Please check back shortly.</p>
    <p class="sign">SkyCobra Studio</p>
  </main>
</body>
</html>
