<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyCobra Studio</title>
<meta name="description" content="SkyCobra Studio — Romain Castel, développeur XR et jeu vidéo. Site en construction.">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    color:#f4ecd6;
    /* Simplified dark wood — same visual family as the site, without depending on it. */
    background-image:
      repeating-linear-gradient(0deg,rgba(20,10,4,.20) 0,transparent 1px,transparent 4px),
      repeating-linear-gradient(180deg,transparent 0,transparent 86px,rgba(12,6,2,.75) 87px,rgba(12,6,2,.5) 89px,transparent 90px,transparent 180px),
      repeating-linear-gradient(180deg,transparent 0,transparent 138px,rgba(8,4,1,.6) 139px,rgba(8,4,1,.8) 141px,transparent 143px,transparent 247px),
      radial-gradient(ellipse 60px 22px at 22% 30%,rgba(10,5,2,.5) 0%,transparent 70%),
      radial-gradient(ellipse 48px 18px at 74% 68%,rgba(10,5,2,.45) 0%,transparent 70%),
      linear-gradient(180deg,#4a3220 0%,#3a2614 50%,#2a1b0c 100%);
    background-attachment:fixed;
  }

  .card{
    width:100%;
    max-width:520px;
    padding:44px 40px 38px;
    text-align:center;
    border:1px solid #c9b582;
    border-radius:3px;
    box-shadow:0 10px 40px rgba(0,0,0,.45);
    color:#3a2c1c;
    background-image:
      radial-gradient(ellipse 200px 120px at 78% 6%,rgba(150,100,50,.15) 0%,transparent 70%),
      radial-gradient(ellipse 170px 95px at 12% 94%,rgba(150,100,50,.13) 0%,transparent 70%),
      radial-gradient(ellipse at 30% 20%,#f4ecd6 0%,#ead9b3 65%,#d8c391 100%);
  }

  .name{
    margin:0 0 6px;
    font-family:Georgia,'Times New Roman',serif;
    font-size:30px;
    font-weight:600;
    letter-spacing:.07em;
    color:#1f160c;
  }

  .owner{
    margin:0 0 26px;
    font-size:14px;
    letter-spacing:.04em;
    color:#6a5532;
  }

  .rule{
    width:52px;
    height:2px;
    margin:0 auto 24px;
    background:#b48a2c;
    border-radius:2px;
  }

  .status{
    margin:0 0 8px;
    font-size:15px;
    line-height:1.6;
    color:#4a3a22;
  }

  .status-en{
    margin:0 0 30px;
    font-size:13px;
    font-style:italic;
    color:#6a5532;
  }

  .links{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin:0;
    padding:0;
    list-style:none;
  }

  .links a{
    display:block;
    padding:10px 18px;
    border:1px solid rgba(31,22,12,.32);
    border-radius:3px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.03em;
    color:#3a2c1c;
    text-decoration:none;
    transition:border-color .16s ease,color .16s ease,background-color .16s ease;
  }

  .links a:hover,
  .links a:focus-visible{
    border-color:#6f521a;
    color:#6f521a;
    background:rgba(255,255,255,.3);
  }

  a:focus-visible{outline:2px solid #6f521a;outline-offset:3px}

  @media (max-width:520px){
    .card{padding:34px 24px 30px}
    .name{font-size:25px}
  }
</style>
</head>
<body>
  <main class="card">
    <h1 class="name">SkyCobra Studio</h1>
    <p class="owner">Romain Castel</p>
    <div class="rule"></div>
    <p class="status">Le site est en cours de construction.</p>
    <p class="status-en">Site under construction.</p>
    <ul class="links">
      <li><a href="https://www.linkedin.com/in/romain-castel/" rel="noopener">LinkedIn</a></li>
      <li><a href="https://github.com/SkyCobra" rel="noopener">GitHub</a></li>
      <li><a href="https://skycobra.itch.io" rel="noopener">Itch.io</a></li>
    </ul>
  </main>
</body>
</html>
